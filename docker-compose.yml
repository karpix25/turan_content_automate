services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-content_studio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-content_studio}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - content-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - content-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=* --workers 2 --timeout-keep-alive 30
    expose:
      - "8000"
    # No code volume in production! It overwrites the built image.
    volumes:
      - media_data:/app/database/media
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-content_studio}
      - REDIS_URL=redis://redis:6379/0
      - VIZARD_API_KEY=${VIZARD_API_KEY}
      - SCRAPE_CREATORS_API_KEY=${SCRAPE_CREATORS_API_KEY}
      - RAPIDAPI_KEY=${RAPIDAPI_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - TELEGRAM_ADMIN_IDS=${TELEGRAM_ADMIN_IDS}
      - POSTMYPOST_API_KEY=${POSTMYPOST_API_KEY}
      - POSTMYPOST_PUBLICATION_RATE_LIMIT=${POSTMYPOST_PUBLICATION_RATE_LIMIT:-4/m}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - PLATES_DIR=/app/database/media/plates
      - CTA_DIR=/app/database/media/cta
      - OUTPUT_DIR=/app/database/media/output
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - HEYGEN_API_KEY=${HEYGEN_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - KIE_API_KEY=${KIE_API_KEY:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - YANDEX_DISK_TOKEN=${YANDEX_DISK_TOKEN}
      - REMOTION_CONCURRENCY=${REMOTION_CONCURRENCY:-4}
      - HYPERFRAMES_RENDER_WORKERS=${HYPERFRAMES_RENDER_WORKERS:-1}
      - HYPERFRAMES_RENDER_QUALITY=${HYPERFRAMES_RENDER_QUALITY:-high}
      - HYPERFRAMES_RENDER_CRF=${HYPERFRAMES_RENDER_CRF:-18}
      - KIE_CONCURRENCY=${KIE_CONCURRENCY:-3}
      - FFMPEG_X264_PRESET=${FFMPEG_X264_PRESET:-veryfast}
      - FFMPEG_X264_CRF=${FFMPEG_X264_CRF:-18}
      - PYTHONPATH=.
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - content-network
      - coolify

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    working_dir: /app/backend
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    stop_grace_period: 120s
    command: celery -A app.worker.celery_app worker --loglevel=${CELERY_LOG_LEVEL:-info} --concurrency=${WORKER_CONCURRENCY:-1} --prefetch-multiplier=${WORKER_PREFETCH_MULTIPLIER:-1} --max-tasks-per-child=${WORKER_MAX_TASKS_PER_CHILD:-5} --soft-time-limit=${WORKER_SOFT_TIME_LIMIT:-21600} --time-limit=${WORKER_TIME_LIMIT:-25200} -Ofair
    volumes:
      - media_data:/app/database/media
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-content_studio}
      - REDIS_URL=redis://redis:6379/0
      - VIZARD_API_KEY=${VIZARD_API_KEY}
      - SCRAPE_CREATORS_API_KEY=${SCRAPE_CREATORS_API_KEY}
      - RAPIDAPI_KEY=${RAPIDAPI_KEY}
      - POSTMYPOST_API_KEY=${POSTMYPOST_API_KEY}
      - POSTMYPOST_PUBLICATION_RATE_LIMIT=${POSTMYPOST_PUBLICATION_RATE_LIMIT:-4/m}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - PLATES_DIR=/app/database/media/plates
      - CTA_DIR=/app/database/media/cta
      - OUTPUT_DIR=/app/database/media/output
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - HEYGEN_API_KEY=${HEYGEN_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - KIE_API_KEY=${KIE_API_KEY:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - YANDEX_DISK_TOKEN=${YANDEX_DISK_TOKEN}
      - PYTHONPATH=.
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout=10 | grep -q OK"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    networks:
      - content-network

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command: celery -A app.worker.celery_app beat --loglevel=info --pidfile=
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-content_studio}
      - REDIS_URL=redis://redis:6379/0
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - PYTHONPATH=.
    depends_on:
      - db
      - redis
    networks:
      - content-network

  bot:
    build:
      context: ./bot
    restart: unless-stopped
    init: true
    # No code volume!
    environment:
      - BACKEND_API_URL=http://api:8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-content_studio}
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - WEBAPP_URL=${WEBAPP_URL}
      - PYTHONPATH=.
    depends_on:
      - db
      - redis
    networks:
      - content-network

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    expose:
      - "80"
    labels:
      - "traefik.docker.network=coolify"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - content-network
      - coolify

networks:
  content-network:
    driver: bridge
  coolify:
    external: true

volumes:
  postgres_data:
  media_data:
