version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-content_studio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - content-network

  redis:
    image: redis:7-alpine
    networks:
      - content-network

  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # No code volume in production! It overwrites the built image.
    volumes:
      - media_data:/app/database/media
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-content_studio}
      - REDIS_URL=redis://redis:6379/0
      - VIZARD_API_KEY=${VIZARD_API_KEY}
      - SCRAPE_CREATORS_API_KEY=${SCRAPE_CREATORS_API_KEY}
      - POSTMYPOST_API_KEY=${POSTMYPOST_API_KEY}
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - WHISPER_DEVICE=cpu
      - PYTHONPATH=.
    depends_on:
      - db
      - redis
    networks:
      - content-network

  worker:
    build:
      context: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - media_data:/app/database/media
      - hf_cache:/root/.cache/huggingface
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-content_studio}
      - REDIS_URL=redis://redis:6379/0
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_CACHE=/root/.cache/huggingface/hub
      - TRANSFORMERS_CACHE=/root/.cache/huggingface/transformers
      - VIZARD_API_KEY=${VIZARD_API_KEY}
      - SCRAPE_CREATORS_API_KEY=${SCRAPE_CREATORS_API_KEY}
      - POSTMYPOST_API_KEY=${POSTMYPOST_API_KEY}
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - WHISPER_DEVICE=cpu
      - PYTHONPATH=.
    depends_on:
      - db
      - redis
    networks:
      - content-network

  beat:
    build:
      context: ./backend
    command: celery -A app.worker.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-content_studio}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=.
    depends_on:
      - db
      - redis
    networks:
      - content-network

  bot:
    build:
      context: ./bot
    # No code volume!
    environment:
      - BACKEND_API_URL=${BACKEND_API_URL:-http://api:8000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-content_studio}
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - WEBAPP_URL=${WEBAPP_URL}
      - PYTHONPATH=.
    depends_on:
      - db
      - redis
    networks:
      - content-network

  frontend:
    build:
      context: ./frontend
    networks:
      - content-network

networks:
  content-network:
    driver: bridge

volumes:
  postgres_data:
  media_data:
  hf_cache:
