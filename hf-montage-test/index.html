      :root {
        --font-main: "Oswald", "Arial Narrow", "Segoe UI", sans-serif;
        --bg-0: #c4cad5;
        --bg-1: #ccd2dc;
        --bg-2: #b8beca;
        --ink-0: #1b2438;
        --ink-1: #2e394f;
        --ink-2: #687287;
        --bg-gradient:
          radial-gradient(circle at 16% 22%, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0) 42%),
          radial-gradient(circle at 84% 78%, rgba(139, 150, 170, 0.16) 0%, rgba(139, 150, 170, 0) 44%),
          linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 60%, var(--bg-2) 100%);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #111;
        font-family: "Oswald", sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--bg-gradient);
      }
      #top-strip {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 66px;
        background: rgba(54, 58, 64, 0.94);
        z-index: 20;
      }
      #stage-layout {
        position: absolute;
        inset: 0;
      }
      #safe-margins {
        position: absolute;
        inset: 18px;
        border-radius: 20px;
        border: 1px dashed rgba(255, 255, 255, 0.1);
        pointer-events: none;
        opacity: 0;
      }
      #a-roll-wrapper {
        position: absolute;
        overflow: hidden;
        background: #1b1f28;
        z-index: 3;
      }
      #a-roll {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #frame-outline {
        position: absolute;
        width: 1008px;
        height: 816px;
        left: 68px;
        top: 132px;
        border-radius: 24px;
        border: none;
        box-shadow: none;
        pointer-events: none;
        z-index: 4;
        opacity: 0 !important;
      }

      #panel-shell {
        position: absolute;
        left: 1118px;
        top: 132px;
        width: 734px;
        height: 816px;
        border-radius: 0;
        border: none;
        background: transparent;
        box-shadow: none;
        overflow: hidden;
        z-index: 5;
      }
      #scene-deck {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .scene-card {
        position: absolute;
        inset: 0;
        padding: 0;
        opacity: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }
      .scene-main {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 10px 6px 6px;
      }
      .scene-line {
        color: var(--ink-0);
        text-transform: uppercase;
        font-family: "Oswald", sans-serif;
        font-weight: 700;
        letter-spacing: -0.8px;
        line-height: 0.88;
      }
      .scene-subline {
        color: rgba(34, 43, 61, 0.84);
        text-transform: uppercase;
        font-family: "Oswald", sans-serif;
        font-weight: 600;
        letter-spacing: -0.3px;
        line-height: 0.9;
      }
      .scene-title {
        margin: 0;
      }
      .word-span {
        display: inline-block;
        white-space: pre;
        opacity: 0.18;
      }
      #avatar-cues {
        position: absolute;
        left: 50%;
        bottom: 46px;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .avatar-cue-pill {
        display: none;
        align-items: center;
        height: 46px;
        padding: 0 18px;
        border-radius: 999px;
        background: var(--avatar-cue-bg);
        border: var(--avatar-cue-border);
        color: var(--avatar-cue-color);
        font-size: 30px;
        font-weight: 760;
        letter-spacing: -0.2px;
        opacity: 0;
      }
      .cue-pill {
        display: none;
      }

      .layout-avatar_frame .scene-main {
        padding: 8px 0 0 2px;
      }
      .layout-avatar_frame .scene-line {
        font-size: 92px;
        max-width: 722px;
        letter-spacing: -1.3px;
        line-height: 0.86;
      }
      .layout-avatar_frame .scene-subline {
        margin-top: 8px;
        font-size: 62px;
        max-width: 712px;
        letter-spacing: -0.8px;
        line-height: 0.84;
        opacity: 0.58;
      }

      .layout-presentation_full .scene-main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        text-align: center;
        padding: 164px 52px 0;
      }
      .layout-presentation_full .scene-line {
        font-size: 198px;
        line-height: 0.84;
        letter-spacing: -2.2px;
      }
      .layout-presentation_full .scene-subline {
        margin-top: 20px;
        font-size: 88px;
        line-height: 0.86;
        letter-spacing: -1px;
        opacity: 0.68;
      }
      .scene-ghost {
        position: absolute;
        left: 50%;
        bottom: -34px;
        transform: translateX(-50%);
        color: rgba(111, 121, 141, 0.16);
        font-family: "Oswald", sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 382px;
        letter-spacing: -3px;
        line-height: 0.8;
        white-space: nowrap;
        pointer-events: none;
      }
      .scene-ghost::after {
        content: attr(data-ghost);
        position: absolute;
        left: 0;
        top: 100%;
        transform: scaleY(-1);
        transform-origin: top;
        color: rgba(111, 121, 141, 0.13);
        filter: blur(0.3px);
      }

      .layout-avatar_full .scene-main {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 196px;
        height: 112px;
        padding: 8px 8px 6px;
        border-radius: 8px 0 0 0;
        background: linear-gradient(180deg, rgba(235, 240, 247, 0.98), rgba(222, 229, 239, 0.94));
        border: 1px solid rgba(255, 255, 255, 0.58);
        box-shadow: 0 8px 18px rgba(12, 20, 32, 0.22);
        overflow: hidden;
      }
      .layout-avatar_full .scene-line {
        font-size: 34px;
        line-height: 0.84;
        letter-spacing: -0.7px;
      }
      .layout-avatar_full .scene-subline {
        margin-top: -2px;
        font-size: 44px;
        line-height: 0.82;
        letter-spacing: -1px;
        opacity: 0.16;
      }
      .layout-avatar_full .scene-ghost {
        display: none;
      }

      #stage-layout.mode-full #a-roll-wrapper {
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        border-radius: 0;
        box-shadow: none;
      }
      #stage-layout.mode-mini #a-roll-wrapper {
        left: 68px;
        top: 132px;
        width: 1008px;
        height: 816px;
        border-radius: 24px;
        box-shadow: 0 14px 34px rgba(11, 17, 30, 0.16);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

        VALID_CARD_STYLES.includes(v)

        VALID_CARD_STYLES.includes(v)
      );
      const FALLBACK_LAYOUT_CYCLE = ["avatar_full", "avatar_frame", "presentation_full"];
      const FALLBACK_CARD_STYLE_CYCLE = ["hero", "metrics", "steps", "quote"];
      const FALLBACK_VISIBLE_CARD_STYLE_CYCLE = ["metrics", "steps", "quote", "hero"];

      const TEXT_LIMITS = {
        titleMain: 120,

        lead: 150,

        step: 120,
        barLabel: 50,
        ...(THEME.textLimits || {})

      function wrapInWords(text, sceneIdx, blockType, lineIdx = 0) {
        if (!text) return "";
        return text.split(" ").map((word, i) => {
          return `<span class="word-span word-vocal w-${sceneIdx}-${blockType}-${lineIdx}-${i}">${word} </span>`;
        }).join("");
      }

      function applyThemeCssVars() {
        const vars = THEME.cssVars || {};
        Object.entries(vars).forEach(([key, value]) => {
          if (!key.startsWith("--")) return;
          if (value === null || value === undefined || value === "") return;
          document.documentElement.style.setProperty(key, String(value));
        });
      }
      applyThemeCssVars();

      const ICONS = {
        alert: [

      function escapeHtml(text) {
        return String(text || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function iconForScene(scene) {
        const sample = `${scene.keyword || ""} ${(scene.titleLines || []).join(" ")} ${(scene.insight || "")}`.toLowerCase();
        if (/ошиб|риск|угроз|флаг/.test(sample)) return "alert";
        if (/ии|интеллект|алгоритм|технолог/.test(sample)) return "cpu";
        if (/налог|фнс|ндс|контрол/.test(sample)) return "shield";
        if (/обнал|деньг|стоим|выгод/.test(sample)) return "wallet";
        if (/уров|данн|транзак|цепоч/.test(sample)) return "chart";
        return "check";
      }

      function normalizeCueList(cues, sceneStart, sceneEnd) {
        const raw = Array.isArray(cues) ? cues : [];
        return raw
          .map((c) => ({
            time: Number(c.time),
            text: String(c.text || "").trim()
          }))
          .filter((c) => Number.isFinite(c.time) && c.time >= sceneStart && c.time <= sceneEnd && c.text)
          .slice(0, 4);
      }

      function resolveLayoutMode(scene, idx) {
        const explicit = String(scene.layoutMode || "").toLowerCase();
        if (VALID_LAYOUTS.includes(explicit)) return explicit;
        const cycle = LAYOUT_CYCLE.length ? LAYOUT_CYCLE : FALLBACK_LAYOUT_CYCLE;
        return cycle[idx % cycle.length];
      }

      function resolveCardStyle(scene, idx) {
        const explicit = String(scene.cardStyle || "").toLowerCase();
        if (VALID_CARD_STYLES.includes(explicit)) return explicit;
        const styleCycle = CARD_STYLE_CYCLE.length ? CARD_STYLE_CYCLE : FALLBACK_CARD_STYLE_CYCLE;
        const layoutMode = resolveLayoutMode(scene, idx);
        if (layoutMode === "avatar_full") return styleCycle[idx % styleCycle.length];
        let visibleIndex = -1;
        for (let i = 0; i <= idx; i += 1) {
          if (resolveLayoutMode(scenePlan[i], i) !== "avatar_full") visibleIndex += 1;
        }
        const visibleCycle = VISIBLE_CARD_STYLE_CYCLE.length ? VISIBLE_CARD_STYLE_CYCLE : FALLBACK_VISIBLE_CARD_STYLE_CYCLE;
        return visibleCycle[visibleIndex % visibleCycle.length];
      }

      function truncateText(text, maxLen) {
        const s = String(text || "").trim();
        if (!s) return "";
        if (s.length <= maxLen) return s;
        return `${s.slice(0, maxLen - 1).trim()}…`;
      }

      function splitIntoLines(text, maxLen = 24) {
        const source = String(text || "").replace(/\s+/g, " ").trim();
        if (!source) return [];
        const words = source.split(" ");
        const lines = [];
        let current = "";
        words.forEach((word) => {
          if (!current) {
            current = word;
            return;
          }
          const candidate = `${current} ${word}`;
          if (candidate.length <= maxLen) {
            current = candidate;
          } else {
            lines.push(current);
            current = word;
          }
        });
        if (current) lines.push(current);
        return lines;
      }

      function normalizeBars(bars) {
        const raw = Array.isArray(bars) ? bars : [];
        return raw
          .map((b) => ({
            label: String(b.label || "").trim(),
            value: Math.max(0, Math.min(1, Number(b.value)))
          }))
          .filter((b) => b.label && Number.isFinite(b.value));
      }

      function createSceneCards() {
        const cards = [];
        let presentationSceneCounter = 0;

        scenePlan.forEach((scene, idx) => {
          const card = document.createElement("section");
          const linesRaw = Array.isArray(scene.titleLines)
            ? scene.titleLines.map((v) => truncateText(v, TEXT_LIMITS.titleMain)).filter(Boolean)
            : [];
          const stepsRaw = Array.isArray(scene.steps)
            ? scene.steps.map((v) => truncateText(v, TEXT_LIMITS.step)).filter(Boolean)
            : [];
          const layoutMode = resolveLayoutMode(scene, idx);
          const cardStyle = resolveCardStyle(scene, idx);
          const keyword = truncateText(scene.keyword || "", 22).toUpperCase();
          let ghostWord = "";
          let allowGhost = false;

          let displayLines = [];
          let subLine = "";
          if (layoutMode === "presentation_full") {
            const variant = presentationSceneCounter % 2;
            if (variant === 0) {
              displayLines = ["CODEX"];
              subLine = "СИСТЕМА ИЗ ТРЕХ ЧАСТЕЙ";
              allowGhost = false;
            } else {
              displayLines = ["КАК УСТРОЕН"];
              subLine = "";
              ghostWord = "CODEX";
              allowGhost = true;
            }
            presentationSceneCounter += 1;
          } else if (layoutMode === "avatar_full") {
            displayLines = ["КАК УСТРОЕН"];
            subLine = "CODEX";
          } else {
            const frameRaw = [...linesRaw, ...stepsRaw, truncateText(scene.insight || "", 80)]
              .flatMap((v) => splitIntoLines(v, 18))
              .map((v) => truncateText(v, 20).toUpperCase())
              .filter(Boolean);
            displayLines = frameRaw.slice(0, 6);
            if (displayLines.length === 0) displayLines = [truncateText(scene.keyword || "ТЕМА", 22).toUpperCase()];
            subLine = truncateText(frameRaw.slice(6, 9).join(" ") || scene.cta || "", 34).toUpperCase();
          }

          card.className = `scene-card layout-${layoutMode} style-${cardStyle}`;
          card.dataset.sceneIndex = String(idx);
          card.dataset.cardStyle = cardStyle;
          const titleHtml = displayLines
            .map((line, lineIdx) => `<div class="scene-line">${wrapInWords(line, idx, "title", lineIdx)}</div>`)
            .join("");
          const subHtml = subLine ? `<div class="scene-subline">${wrapInWords(subLine, idx, "sub", 0)}</div>` : "";
          if (!ghostWord && layoutMode === "presentation_full" && allowGhost) {
            const fallbackGhost = truncateText(
              String(scene.keyword || displayLines[0] || "CODEX")
                .replace(/[^A-Za-zА-Яа-яЁё0-9\s-]/g, "")
                .trim()
                .toUpperCase(),
              18
            );
            if (fallbackGhost && fallbackGhost.length > 12) ghostWord = fallbackGhost;
          }
          const ghostHtml =
            layoutMode === "presentation_full" && allowGhost && ghostWord
              ? `<div class="scene-ghost" data-ghost="${escapeHtml(ghostWord)}">${escapeHtml(ghostWord)}</div>`
              : "";

          card.innerHTML = `
            <div class="scene-main">
              <h1 class="scene-title">${titleHtml}</h1>
              ${subHtml}
              ${ghostHtml}
            </div>
          `;

          sceneDeck.appendChild(card);
          cards.push(card);
        });

        return cards;
      }

          tl.set(cards, { autoAlpha: 0 }, at);
          tl.set(card, { autoAlpha: 1 }, at + 0.01);

          // Показываем основную мысль в плашке внизу
          const insight = scene.insight || "ОСНОВНАЯ МЫСЛЬ";
          tl.set("#avatar-cues", { 
            innerHTML: `<div class="avatar-cue-pill" style="display:flex; opacity:1;">${escapeHtml(insight)}</div>`, 
            autoAlpha: 0 
          }, at);
          tl.to("#avatar-cues", { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, at + 0.4);

          tl.fromTo(
            blocks,
            { y: 12, autoAlpha: 0 },
            { y: 0, autoAlpha: 1, duration: 0.4, stagger: 0.08, ease: "power2.out" },
            at + 0.14
          );

          tl.fromTo(
            words,
            { opacity: 0.16, y: 2 },
            { opacity: 1, y: 0, duration: 0.3, stagger: 0.015, ease: "power1.out" },
            at + 0.2
          );

          if (ghost) {
            tl.fromTo(
              ghost,
              { autoAlpha: 0, y: 16 },
              { autoAlpha: 1, y: 0, duration: 0.56, ease: "power2.out" },
              at + 0.28
            );
          }
        });

        window.__timelines.main = tl;
      }

      const cards = createSceneCards();
      buildTimeline(cards);
    </script>

    <div id="scrubber-ui" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:80%; background:rgba(0,0,0,0.8); padding:15px; border-radius:10px; z-index:10000; display:flex; align-items:center; gap:15px; color:white; font-family:sans-serif;">
      <span id="time-display" style="min-width:60px;">0:00</span>
      <input type="range" id="time-slider" min="0" max="1" step="0.001" value="0" style="flex:1; cursor:pointer;">
    </div>

    <script>
      if (window.isHyperframesRender) {
        document.getElementById('scrubber-ui').style.display = 'none';
      }

      window.addEventListener('load', () => {
        const slider = document.getElementById('time-slider');
        const display = document.getElementById('time-display');
        
        const checkTimeline = setInterval(() => {
          if (window.__timelines && window.__timelines.main) {
            clearInterval(checkTimeline);
            const tl = window.__timelines.main;
            const dur = tl.duration();
            
            slider.addEventListener('input', () => {
              tl.pause();
              tl.progress(slider.value);
              const cur = (slider.value * dur).toFixed(1);
              display.innerText = `${Math.floor(cur/60)}:${(cur%60).toFixed(0).padStart(2,'0')}`;
            });

            tl.eventCallback("onUpdate", () => {
              if (!slider._isDragging) {
                slider.value = tl.progress();
                const cur = tl.time().toFixed(1);
                display.innerText = `${Math.floor(cur/60)}:${(cur%60).toFixed(0).padStart(2,'0')}`;
              }
            });
          }
        }, 500);
      });
    </script>
  </body>
</html>
