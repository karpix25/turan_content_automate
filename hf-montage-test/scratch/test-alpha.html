<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { 
      background: rgba(0,0,0,0); 
      margin: 0; 
      overflow: hidden; 
      width: 1920px; 
      height: 1080px;
    }
    #blob { 
      width: 400px; 
      height: 400px; 
      background: #ff0000; 
      border-radius: 50%; 
      position: absolute; 
      top: 340px; 
      left: 760px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 40px;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="test" data-start="0" data-duration="2">
    <div id="blob" class="clip" data-start="0" data-duration="2">ALPHA TEST</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.to("#blob", { x: 300, rotation: 360, duration: 2, ease: "none" });
    window.__timelines["test"] = tl;
  </script>
</body>
</html>
